<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>방문 기록 · hit-shot</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #202534; }
    label { display: block; margin: 1rem 0; }
    input, button { font: inherit; padding: .55rem; }
    input { max-width: 100%; box-sizing: border-box; }
    #token { width: 22rem; }
    #visitorId { width: 24rem; }
    button { cursor: pointer; }
    section { border-top: 1px solid #ddd; padding: 1rem 0; }
    ul { padding-left: 1.25rem; }
    li { margin: .65rem 0; overflow-wrap: anywhere; }
    small { color: #596172; }
  </style>
</head>
<body>
  <h1>방문 기록</h1>
  <p>최근 30일 기록입니다. 방문자 ID는 브라우저 단위이며 실제 사람이나 회사를 확정하지 않습니다.</p>
  <label>관리자 토큰 <input id="token" type="password" autocomplete="off"></label>
  <label>방문자 ID (선택) <input id="visitorId" autocomplete="off"></label>
  <button id="load">조회</button>
  <p id="status" role="status"></p>
  <main id="results"></main>
  <script>
    document.getElementById('load').addEventListener('click', async () => {
      const token = document.getElementById('token').value;
      const visitorId = document.getElementById('visitorId').value.trim();
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      results.replaceChildren();
      status.textContent = '조회 중…';
      try {
        const query = new URLSearchParams({ limit: '100' });
        if (visitorId) query.set('visitorId', visitorId);
        const response = await fetch('/api/analytics/visits?' + query, {
          headers: { 'X-Analytics-Admin-Token': token },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(response.status === 401 ? '토큰을 확인해 주세요.' : '조회에 실패했습니다.');
        const events = await response.json();
        const groups = new Map();
        for (const event of events) {
          if (!groups.has(event.visitorId)) groups.set(event.visitorId, []);
          groups.get(event.visitorId).push(event);
        }
        for (const [id, visits] of groups) {
          const section = document.createElement('section');
          const heading = document.createElement('h2');
          heading.textContent = id;
          section.append(heading);
          const list = document.createElement('ul');
          for (const visit of visits) {
            const item = document.createElement('li');
            const date = new Date(visit.viewedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
            item.textContent = `${date} · ${visit.path}`;
            const detail = document.createElement('small');
            detail.textContent = `유입: ${visit.referrerOrigin || '없음'} · 캠페인: ${visit.campaign || '없음'}`;
            item.append(document.createElement('br'), detail);
            list.append(item);
          }
          section.append(list);
          results.append(section);
        }
        status.textContent = `${events.length}건 조회됨`;
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
